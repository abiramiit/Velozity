version: '3.8'

services:
  db:
    image: postgres:15
    container_name: dashboard_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: dashboard_db
    ports:
      - "5432:5432"
    volumes:
      - db_data2:/var/lib/postgresql/data

volumes:
  db_data2:
